// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// The social login plugin asks for androidx.browser 1.9.0 at compile time, and
// its Google helper brings 1.4.0 at run time. Gradle refuses the mix. 1.9.0
// needs compileSdk 36 and a newer Android Gradle plugin, so 1.8.0 is the pin.
subprojects {
    configurations.configureEach {
        resolutionStrategy.force 'androidx.browser:browser:1.8.0'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
